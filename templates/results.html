{% extends "base.html" %}

{% block head %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Assessment Results</title>
{% endblock %}

{% block body %}
  <div class="app">

      <a class="icon-btn" href="{{ url_for('choose_test') }}">←</a>

    <main class="card">

      <p class="subtitle">Your Results</p>

      <div class="score-box">
        <div class="score-label"></div>
        <div id="final-score">0</div>
      </div>

      <div class="metric-list">
        <div class="metric"><span>Finger-to-Floor</span><span>8 cm</span></div>
        <div class="metric"><span>Single Leg Stand</span><span>32 s</span></div>
        <div class="metric"><span>McGill 60-Second Core Endurance</span><span>37 s</span></div>
        <div class="metric"><span>30-Second Sit-to-Stand</span><span id="metricScore">32 reps</span></div>
      </div> -->

      <div class="micro">Results are movement-screening measurements and should be interpreted in context.</div>

      <div class="spacer"></div>

      <button class="btn" id="exportResult">Export</button>
      <a class="btn secondary" href="{{ url_for('home') }}">Done</a>
    </main>
  </div>

  <script src="{{url_for('static', filename='javascript/main.js')}}"></script>

{% endblock %}
